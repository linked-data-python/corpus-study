# Evaluation configuration — every threshold of the pipeline lives here.
# Any change to this file should bump [meta].config_version; the version is
# stamped into every generated result for traceability.

[meta]
config_version = "1.0.0"
# Version of the evaluation pipeline semantics (bumped when metric
# definitions change, independently of the code version).
metrics_version = "1.0.0"

[discovery]
# Strategies actually implemented in rdfeval.discover; each hit records its
# source so the corpus provenance is auditable.
strategies = ["github_code_search", "github_repo_search", "wheelodex_rdepends", "seed_list"]
# GitHub code-search queries: each is run and repositories of matching files
# are collected (diversity beats popularity: several phrasings of rdflib use).
github_code_queries = [
    "\"from rdflib import\" language:python",
    "\"import rdflib\" language:python",
    "\"rdflib.Graph()\" language:python",
    "\"prepareQuery\" rdflib language:python",
]
github_repo_queries = [
    "rdflib in:readme,description language:python",
    "sparql rdflib language:python",
    "ontology rdflib language:python",
    "\"knowledge graph\" rdflib language:python",
]
max_pages_per_query = 3          # 100 results/page on repo search, 100 on code search
# Seed list: known substantial RDFLib users, curated for domain diversity
# (libraries, applications, converters, ontology tooling, SPARQL-heavy).
seed_repositories = [
    "RDFLib/pySHACL",
    "RDFLib/OWL-RL",
    "RDFLib/pyLODE",
    "RDFLib/sparqlwrapper",
    "RDFLib/rdflib-endpoint",
    "morph-kgc/morph-kgc",
    "oeg-upm/yatter",
    "linkml/linkml",
    "BrickSchema/py-brickschema",
    "NREL/BuildingMOTIF",
    "westurner/csvw" ,
    "cthoyt/pystow",
    "biopragmatics/bioregistry",
    "geopython/pygeoapi",
    "opensemanticsearch/open-semantic-etl",
    "SDM-TIB/SDM-RDFizer",
    "usc-isi-i2/kgtk",
    "vemonet/sparql-void-generator",
    "gnames/gnverifier",
    "zincware/ZnTrack",
]

[selection]
# Repository-level inclusion criteria, first stage: everything that can be
# decided from GitHub metadata alone, before cloning anything.  This is option
# B7 of `options_repo_selection.md`, retained on 2026-08-28; `funnel.md` §6
# records why.  A candidate must satisfy *every* criterion below.
exclude_forks = true
exclude_archived = false          # archived projects are still real-world code
exclude_mirrors = true            # mirrors and templates are not projects
min_python_bytes = 10_000         # ≈ 250 lines: rules out repos with a stray .py
min_commits = 10                  # rules out throwaway repositories
min_size_kb = 50                  # rules out toys
max_size_kb = 200_000             # rules out data dumps (bioregistry alone: 1.6 GB)
min_last_commit = "2020-01-01"    # code abandoned before Python 3.8 is not a target
require_snippet_licence = true    # only repos whose licence allows publishing a snippet
# Teaching material: one near-identical copy of the same assignment per
# student, so every shape would be counted as many times as there are students.
# Matched against the full name, the description and the GitHub topics.
exclude_teaching = true
teaching_markers = [
    "curso", "course", "tutorial", "exercise", "exercice", "homework",
    "practica", "práctica", "assignment", "workshop", "bootcamp", "lecture",
    "teaching", "student", "classroom", "vorlesung", "ejercicio", "coursework",
    "kurs",
]
# A repository *named* after the library under study is that library, not a
# user of it.  The list holds rdflib and its ancestors only: pySHACL, OWL-RL
# or SPARQLWrapper are RDF libraries too, but they are written *against*
# rdflib and are exactly the kind of code the study is about.  A vendored copy
# of any of them is caught by `[analysis] vendored_dirs`, not here.
exclude_library_clones = true
library_clone_names = ["rdflib", "rdfextras", "rdflib-rdfstar"]
# Second stage, decided only after cloning and analysis (`rdfeval analyze`):
# repositories that satisfy the metadata criteria but turn out to contain no
# analysable RDF Python are marked `pruned` in the manifest, kept for
# provenance, and excluded from the census, the surface analysis and sampling.
min_python_files = 2
min_rdf_files = 1                 # at least one RDF-relevant file after analysis
prune_after_analysis = true
# Licences under which storing extracted snippets in this repository is
# acceptable. Repositories under other licences stay in the manifest and the
# aggregate statistics, but no source region is copied out of them.
snippet_licences = [
    "MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "ISC",
    "CC0-1.0", "Unlicense", "0BSD", "MPL-2.0",
    "EPL-2.0", "GPL-3.0", "GPL-2.0", "LGPL-3.0", "LGPL-2.1", "AGPL-3.0",
    "EUPL-1.2", "CC-BY-4.0", "CC-BY-SA-4.0", "W3C-20150513",
]
max_repos = 500                   # safety cap on the manifest size

[acquisition]
clone_depth = 1                   # shallow clone; the commit SHA is recorded
corpus_dir = "corpus/repos"
jobs = 8                          # parallel clones

[analysis]
# Files larger than this are skipped (generated files, data dumps).
max_file_bytes = 1_000_000
# Reuse a repository's previous analysis when its pinned commit has not moved.
# Analysing several hundred checkouts must survive an interruption.
reuse_existing = true
# Directories never analysed inside a repository checkout.  `site-packages`
# and `dist-packages` matter: some repositories commit a whole virtualenv,
# whose vendored libraries (rdflib itself included) are not project code and
# would otherwise be counted as real-world RDFLib usage.
exclude_dirs = [".git", ".tox", ".venv", "venv", "env", "env1", "virtualenv",
                "site-packages", "dist-packages", "node_modules", "build",
                "dist", "__pycache__", ".eggs", ".mypy_cache", ".pytest_cache"]
# Third-party libraries copied into the repository *outside* a virtualenv —
# the `MKLab-ITI/prophet` case, which vendors rdflib at its root and whose RDF
# code is therefore rdflib's own implementation.  A top-level directory bearing
# one of these names is skipped **unless it is the repository's own package**:
# `RDFLib/sparqlwrapper` must keep its `SPARQLWrapper/` tree.
vendored_dirs = ["rdflib", "rdfextras", "isodate", "html5lib", "pyparsing",
                 "sparqlwrapper", "owlrl", "pyshacl", "six", "requests",
                 "dateutil", "chardet", "urllib3"]
# These are never a project's own package: skipped unconditionally.
vendored_dirs_always = ["_vendor", "vendor", "vendored", "third_party",
                        "thirdparty", "externals", "3rdparty"]

[strata]
# The draw: stratified by *type of use* (design record corpus/403).  The
# strata themselves are `rdfeval.surface.STRATA`; their population is the site
# index written by `rdfeval surface`.
#
# FROZEN (2026-08-29).  These three numbers define the population every
# per-stratum reading is made against; changing one invalidates the published
# surface figures and every comparison drawn from them.  The evaluation budget
# is `[campaign]` below, and that is what gets tuned.
seed = 20260828
# Regions drawn per stratum when the population allows it (consigne du
# 2026-08-28).  A stratum with fewer sites contributes all it has.
target_per_stratum = 100
# At most this many regions from one repository in one stratum: without it a
# single large project would define what "real use" looks like.
max_per_repo_per_stratum = 4
# Write one example directory per drawn region (examples403/<stratum>/<id>/)
# as part of `rdfeval strata`.
materialise = true

[campaign]
# How many regions of a stratum are ever TRANSLATED.  The draw (above) is
# frozen at 100 per stratum and stays that way — it is the population the
# strata are read from.  This is the evaluation budget: past a certain
# number, one more pair of the same stratum tells you nothing you did not
# already know, and the effort is better spent on a stratum that is short.
# 20 was chosen (2026-08-29) as the highest count any stratum had actually
# reached; `scripts/make_batches.py --target` defaults to it.
max_pairs_per_stratum = 20

[regions]
# A region is a function/method/class or the module top level.
min_rdf_ops = 2                   # regions with fewer RDF operations are not extracted
max_region_loc = 120              # beyond this, keep the whole file instead
# When the qualifying function regions cover less than this share of the
# file's RDF operations, the whole file is kept instead (extracting a
# region that hides most of the RDF work would be misleading).
coverage_threshold = 0.5

[validation]
timeout_seconds = 60

[userstudy]
# How many validated pairs are exported as user-study task material.
max_tasks = 24

[surface]
# Design-oriented surface analysis (`python -m rdfeval surface`).
#
# Repositories excluded from the *surface* analysis, each with its reason.
# They stay in the corpus and in the analysis of RDF density: what disqualifies
# them is not their code but the fact that counting their shapes would break
# the independence of observations, or that their use of RDFLib is reflexive
# rather than applicative.  No excluded repository contributed any of the 140
# validated translation pairs, so the main study is unaffected.
#
# Format: one "owner/name = reason" line per repository.
[surface.excluded]
"FacultadInformatica-LinkedData/Curso2025-2026" = "course repository: one near-identical copy of the same assignment per student, so every shape is counted as many times as there are students"
"FacultadInformatica-LinkedData/Curso2025-2026-ODKG" = "course repository, and a near-duplicate of Curso2025-2026"
"FacultadInformatica-LinkedData/Curso2021-2022" = "course repository: per-student copies of the same assignment"
"FacultadInformatica-LinkedData/Curso2021-2022-ODKG" = "course repository, and a near-duplicate of Curso2021-2022"
"FacultadInformatica-LinkedData/Curso2023-2024" = "course repository: per-student copies of the same assignment"
"alcides/rdflib" = "a fork of RDFLib itself: its use of RDFLib is the implementation of the library, not application code written against it"
